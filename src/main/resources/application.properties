spring.application.name=moodify-backend

server.port=8081

spring.jackson.serialization.indent-output=true

spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:h2:file:./target/moodifydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#spring.datasource.password=password or better use SPRING_DATASOURCE_PASSWORD env variable

# auth0 configuration
okta.oauth2.issuer=https://dev-5l3w1yvav5vmutet.us.auth0.com/
okta.oauth2.audience=https://Moodify.api

# increase logging for security debugging
#logging.level.org.springframework.security=DEBUG
#logging.level.com.okta.spring=DEBUG